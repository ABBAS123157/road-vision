version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: roadvision_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./roadvision.db
      - SECRET_KEY=roadvision-ai-jwt-super-secret-key-2026-production
    volumes:
      - ../backend/uploads:/app/backend/uploads
      - ../roadvision.db:/app/roadvision.db
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: roadvision_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

