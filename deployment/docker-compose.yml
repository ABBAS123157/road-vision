version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: roadvision_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Node.js Express & MongoDB Gateway
  server:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.server
    container_name: roadvision_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/roadvision
      - PYTHON_BACKEND_URL=http://backend:8000
      - JWT_SECRET=roadvision-ai-jwt-super-secret-key-2026-production
    volumes:
      - ../server/uploads:/app/uploads
    depends_on:
      - mongodb
    restart: unless-stopped

  # Python FastAPI AI Inference Engine (YOLOv8 + OpenCV + ByteTrack)
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: roadvision_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./roadvision.db
      - SECRET_KEY=roadvision-ai-jwt-super-secret-key-2026-production
    volumes:
      - ../backend/uploads:/app/backend/uploads
      - ../roadvision.db:/app/roadvision.db
    restart: unless-stopped

  # React + Vite Production Frontend
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: roadvision_frontend
    ports:
      - "80:80"
    depends_on:
      - server
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
